[maisaka_chat]
display_name = "Planner"
advanced = false
description = "Maisaka のメイン計画テンプレート。身份、時刻、ツール説明、チャット文脈を統合し、思考・判断・ツール呼び出しを進める。"

[maisaka_chat_merged_timing]
display_name = "Planner（タイミング統合）"
advanced = false
description = "独立したタイミング判断を使わない場合の Maisaka メイン計画テンプレート。発話タイミングの判断を Planner に統合する。"

[maisaka_replyer]
display_name = "Replyer"
advanced = false
description = "Maisaka の返信生成テンプレート。人格、表現スタイル、グループチャット上の注意点、返信対象の文脈から最終返信を生成する。"

[reply_attachments]
display_name = "返信の添付案内"
advanced = true
description = "返信に添付する画像、メンション、絵文字はシステムが送信することを示し、本文での添付情報の重複を防ぎます。"

[retro_replyer]
display_name = "レトロ返信"
advanced = true
description = "レトロモード（experimental.replyer_retro_prompt）のグループチャット返信テンプレート。ペルソナとチャットの注意事項を先頭の system メッセージにまとめ、残りのテンプレートを user メッセージとして送信する。"

[retro_replyer_light]
display_name = "レトロ返信（短め）"
advanced = true
description = "レトロモードのグループチャット短め返信テンプレート。旧版の think_level=0 の軽量返信に対応する。"

[retro_private_replyer]
display_name = "レトロ個人チャット返信"
advanced = true
description = "レトロモードの個人チャット返信テンプレート。旧版の方式で返信指示をまとめる。"

[retro_private_replyer_self]
display_name = "レトロ個人チャット補足返信"
advanced = true
description = "レトロモードの個人チャット補足返信テンプレート。直前に自分が送った発言に続けて補足するときに使う。"

[default_expressor]
display_name = "既定表現器"
advanced = true
description = "表現方式の生成と整理に関するテンプレート。通常は表現システムのデバッグ時だけ編集する。"

[emoji_content_analysis]
display_name = "絵文字内容分析"
advanced = true
description = "絵文字やスタンプ画像の内容を分析するためのテンプレート。"

[emoji_content_filtration]
display_name = "絵文字内容フィルタ"
advanced = true
description = "絵文字やスタンプの内容がフィルタ条件を満たすか判断するためのテンプレート。"

[emoji_replace]
display_name = "絵文字置換"
advanced = true
description = "テキスト文脈に応じて絵文字やスタンプを選択・置換するためのテンプレート。"

[emoji_selection]
display_name = "絵文字選択"
advanced = true
description = "文脈と現在の語調に合わせて、絵文字やスタンプのグリッドから最適なものを選ぶためのテンプレート。"

[expression_evaluation]
display_name = "表現評価"
advanced = true
description = "候補表現の品質を評価するためのテンプレート。"

[expression_select]
display_name = "表現選択"
advanced = true
description = "表現ライブラリから適切な表現方式を選択するためのテンプレート。"

[image_description]
display_name = "画像説明"
advanced = false
description = "画像内容をテキスト説明へ変換するためのテンプレート。"

[heuristic_memory_impression]
display_name = "記憶検索印象"
advanced = true
description = "現在のチャット流と直近メッセージから自然言語の印象を生成し、長期記憶の意味検索を補助するテンプレート。"

[jargon_compare_inference]
display_name = "隠語比較推論"
advanced = true
description = "グループ内の隠語の意味を比較・推論するためのテンプレート。"

[jargon_explainer_summarize]
display_name = "隠語説明要約"
advanced = true
description = "隠語説明の結果を要約するためのテンプレート。"

[jargon_inference_content_only]
display_name = "隠語推論"
advanced = true
description = "内容のみから隠語の意味を推論するためのテンプレート。"

[jargon_inference_with_context]
display_name = "隠語文脈推論"
advanced = true
description = "周辺文脈を組み合わせて隠語の意味を推論するためのテンプレート。"

[learn_style]
display_name = "表現スタイル学習"
advanced = true
description = "チャット内容から表現スタイルを学習するためのテンプレート。"

[learn_jargon]
display_name = "隠語学習"
advanced = true
description = "実際のチャットからグループ固有の隠語候補を抽出し、意味と共起分布を更新するためのテンプレート。"

[maisaka_chat_focus]
display_name = "Focus Planner"
advanced = true
description = "Focus モード用の Maisaka 計画テンプレート。現在注目しているチャットとチャット横断概要をもとに次の行動を選択する。"

[maisaka_timing_gate]
display_name = "Timing Gate"
advanced = false
description = "Maisaka のタイミング制御テンプレート。各メインループの前に待機、停止、思考と返信への継続を判断する。"

[memory_fuzzy_modify_plan]
display_name = "長期記憶の曖昧修正計画"
advanced = true
description = "自然言語の修正要求と候補記憶から、失効させる旧記憶と書き込む新記憶を計画するテンプレート。"

[mid_term_memory_summary]
display_name = "中期チャット要約"
advanced = true
description = "コンテキスト裁切時に、削除されるチャット履歴を long_summary、brief、keywords に要約するためのテンプレート。"

[memory_retrieval_react_prompt_head_memory]
display_name = "記憶検索 ReAct ヘッダー"
advanced = true
description = "ReAct 形式の記憶検索フローで使用する高度な記憶検索プロンプトのヘッダー。"

[webui_ai_search]
display_name = "WebUI AI 検索"
advanced = true
description = "自然言語の意図に基づき、WebUI が提供する実在のページと設定候補から関連結果を選択します。"

[webui_ai_search_final]
display_name = "WebUI AI 検索の最終化指示"
advanced = true
description = "AI 検索でツールラウンドを使い切った場合や形式どおりに回答しなかった場合に、調査を終了して最終 JSON を返すよう求めます。"

[webui_ai_search_correction]
display_name = "WebUI AI 検索の修正指示"
advanced = true
description = "AI 検索の回答が根拠検証に失敗した場合に、根拠のない内容を削除して最終 JSON を書き直すよう求めます。"

[webui_ai_search_evidence]
display_name = "WebUI AI 検索の根拠メッセージ"
advanced = true
description = "AI 検索の読み取り専用ツールの結果を、ツールなしのリクエストで使える根拠メッセージに変換します。"
