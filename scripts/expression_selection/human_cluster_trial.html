<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表达场景对照评估</title>
<style>
*{box-sizing:border-box}body{font:15px/1.65 system-ui;background:#f4f6f8;color:#213043;margin:0}main{max-width:1680px;margin:auto;padding:12px}button,select,textarea{font:inherit;border:1px solid #c5cdd7;border-radius:8px;padding:7px 12px;background:white;color:inherit}button{cursor:pointer}button:hover{border-color:#416caa}button[aria-pressed=true]{background:#244f85;color:white}header{position:sticky;top:0;background:#f4f6f8;padding:7px 0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.context,.variant,.verdict{background:white;border:1px solid #dce2e9;border-radius:12px;padding:12px;margin-bottom:10px}.context{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.chat{max-height:300px;overflow:auto;padding:6px 10px;background:#f2f4f7;border-radius:10px}.message{margin:8px 0;max-width:90%}.message.bot{margin-left:auto}.speaker{font-size:12px;color:#647286;margin-bottom:4px}.bubble{display:inline-block;background:white;border:1px solid #e1e5eb;padding:7px 10px;border-radius:2px 12px 12px;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:#e7effb}.message:last-child .bubble{border:2px solid #7398c9}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-width:960px}.compare{overflow-x:auto}.variant{min-width:0}.item{padding:7px 9px;margin:5px 0;border-radius:8px;border:1px solid #e1e5eb;overflow-wrap:anywhere}.item.new{background:#e8f6ed;border-color:#93c8a4}.item.missing{background:#fff0f0;border-color:#e6a1a1}.item.same{background:#f6f7f9}.tag{font-size:12px;color:#526479;display:block}.style{font-weight:600;margin-top:2px}.choices{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 9px}.choices button{padding:5px 9px}pre{white-space:pre-wrap;font:inherit}summary{cursor:pointer;color:#345d8e;margin:7px 0}textarea{width:100%;min-height:65px}.muted{color:#637184;font-size:13px}h1{font-size:23px;margin:4px 0}h2{font-size:18px;margin:0 0 10px}.legend{display:flex;gap:12px;margin:8px 0;flex-wrap:wrap}.green{color:#28743f}.red{color:#b23939}.missing-list{border-top:1px dashed #e6a1a1;margin-top:10px;padding-top:6px}.missing-list h3{font-size:13px;margin:0 0 4px;color:#b23939}.variant>p{margin:4px 0 8px}main>p{margin:4px 0 6px}.notice{background:#edf3fc;padding:10px;border-radius:8px}.verdict{position:sticky;bottom:0;box-shadow:0 -3px 15px #2334490b}.verdict .choices{margin-bottom:0}@media(max-width:800px){main{padding:12px}.context{grid-template-columns:1fr}.chat{max-height:300px}.grid{min-width:900px}.verdict{position:static}}
</style>
<main><h1>表达场景对照评估</h1><p class="muted">先看聊天，再对照三列前10条表达，点选更合适的方案即可。详细评分与备注均可跳过。A为固定基准，B/C顺序随机。颜色只表示相同或不同，不代表质量好坏。</p><header><button id="prev">上一题</button><select id="nav"></select><button id="next">下一题</button><button id="export">导出评分 JSON</button><span id="progress"></span><span id="save" class="muted"></span></header><section id="content"></section></main>
<script>const data=__TRIAL_DATA__;
const key='expression-scene-review-v2-'+data.metadata.index_sha256.slice(0,12);let ratings={};let pos=0;try{ratings=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){document.querySelector('#save').textContent='本地保存不可用，请及时导出'}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nav=document.querySelector('#nav');data.trials.forEach((t,i)=>nav.add(new Option(`${i+1}/${data.trials.length} · 聊天${t.context_id} · ${t.size}条 · ${t.id}`,i)));
function choices(field,values,current){return `<div class="choices">${values.map(([v,s])=>`<button data-field="${field}" data-value="${v}" aria-pressed="${String(current)===String(v)}">${s}</button>`).join('')}</div>`}
function chat(lines){return lines.map(line=>{const match=line.match(/^\s*-?\s*(\d\d:\d\d:\d\d)\s+([^:：]+)[:：]\s*([\s\S]*)$/);let name=match?match[2]:'聊天记录',text=match?match[3]:line;return `<div class="message ${/麦麦/.test(name)?'bot':''}"><div class="speaker">${esc(name)} · ${match?esc(match[1]):''}</div><div class="bubble">${esc(text)}</div></div>`}).join('')}
function items(xs,base,reference=false){return xs.map((x,i)=>{let rank=base.findIndex(b=>b.id===x.id);let cls=reference?'':rank>=0?'same':'new';let tag=reference?'基准表达':rank>=0?`与A相同 · A第${rank+1}条`:'相对A前10条新增';return `<div class="item ${cls}"><span class="tag">${i+1} · ${tag}</span><div>情景：${esc(x.situation)}</div><div class="style">${esc(x.style)}</div></div>`}).join('')}
function progress(){document.querySelector('#progress').textContent=`已选择 ${data.trials.filter(t=>ratings[t.id]?.overall?.preference).length}/${data.trials.length}题`}
function save(){try{localStorage.setItem(key,JSON.stringify(ratings));document.querySelector('#save').textContent='已自动保存'}catch(e){document.querySelector('#save').textContent='保存失败，请立即导出评分'}progress()}
function render(){nav.value=pos;const t=data.trials[pos],r=ratings[t.id]||{},base=t.variants[0].items.slice(0,10);document.querySelector('#content').innerHTML=`<div class="context"><div><h2>聊天${t.context_id} · 看最后一条消息</h2><div class="chat">${chat(t.history)}</div></div><div><h2>这次要怎么回复</h2><div class="notice">${esc(t.guide)}</div><p class="muted">${t.size}条表达库 · ${t.id}只是题号。相同规模再次出现，表示换了一批随机抽取的表达。</p><details><summary>完整检索依据</summary><pre>${esc(t.query)}</pre></details><details><summary>历史实际回复（不是标准答案）</summary>${esc(t.reply)}</details></div></div><div class="legend"><span>比较范围：各方案前10条（按表达ID比较）</span><span class="green">■ 绿色：相对A新增</span><span>■ 灰色：A中也有，标出原位置</span><span class="red">■ 红色：A有、本方案前10条缺少</span></div><div class="compare"><div class="grid">${t.variants.map((v,i)=>{const a=r[v.label]||{},head=v.items.slice(0,10),missing=base.filter(x=>!head.some(y=>y.id===x.id));return `<article class="variant" data-variant="${v.label}"><h2>方案${v.label}${i===0?' · 基准':''}</h2><p class="muted">${i===0?'后两列均与这一列比较':`与A相同${head.length-missing.length}条 · 新增${missing.length}条 · 缺少${missing.length}条`}</p>${items(head,base,i===0)}${i&&missing.length?`<section class="missing-list"><h3>− 相对A缺少${missing.length}条（不属于本方案前10条）</h3>${missing.map(x=>`<div class="item missing"><span class="tag">− 缺少 · A第${base.findIndex(b=>b.id===x.id)+1}条</span>情景：${esc(x.situation)}<div class="style">${esc(x.style)}</div></div>`).join('')}</section>`:''}<details><summary>其余40条候选</summary>${v.items.slice(10).map((x,j)=>`<div class="item">${j+11}. ${esc(x.situation)}<div class="style">${esc(x.style)}</div></div>`).join('')}</details><details><summary>命中场景的代表表达</summary>${v.representatives.map((xs,j)=>`<h3>场景组${j+1}</h3>${xs.map(x=>`<div class="item">${esc(x.situation)}<div>${esc(x.style)}</div></div>`).join('')}`).join('')}</details><details><summary>详细打分（可选，全程点选）</summary><div>前10条有几条能用？</div>${choices('usable',Array.from({length:11},(_,j)=>[j,j]),a.usable)}<div>场景匹配程度</div>${choices('scene',[[0,'跑题'],[1,'多数不对'],[2,'一半'],[3,'多数对'],[4,'都贴合']],a.scene)}<div>表达重复程度</div>${choices('repeat',[[0,'不重复'],[1,'有一点'],[2,'很多']],a.repeat)}<textarea data-field="note" placeholder="备注（可不填）">${esc(a.note||'')}</textarea></details></article>`}).join('')}</div></div><div class="verdict" data-variant="overall"><strong>哪一组更适合这次回复？</strong>${choices('preference',[['A','A更好'],['B','B更好'],['C','C更好'],['AB','A/B并列'],['AC','A/C并列'],['BC','B/C并列'],['ABC','三组相当'],['none','都不合适']],r.overall?.preference)}</div>`;const panel=document.querySelector('.chat');if(panel)panel.scrollTop=panel.scrollHeight;progress()}
document.querySelector('#content').addEventListener('click',e=>{const btn=e.target.closest('button[data-field]');if(!btn)return;const v=btn.closest('[data-variant]').dataset.variant,f=btn.dataset.field,id=data.trials[pos].id;ratings[id]??={};ratings[id][v]??={};const val=ratings[id][v][f]===btn.dataset.value?'':btn.dataset.value;ratings[id][v][f]=val;btn.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===val)));save()});
document.querySelector('#content').addEventListener('input',e=>{if(e.target.tagName!=='TEXTAREA')return;const id=data.trials[pos].id,v=e.target.closest('[data-variant]').dataset.variant;ratings[id]??={};ratings[id][v]??={};ratings[id][v][e.target.dataset.field]=e.target.value;save()});
nav.onchange=()=>{pos=Number(nav.value);render()};document.querySelector('#prev').onclick=()=>{pos=Math.max(0,pos-1);render()};document.querySelector('#next').onclick=()=>{pos=Math.min(data.trials.length-1,pos+1);render()};document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,dataset:data.metadata.index_sha256,ratings},null,2)],{type:'application/json'}));a.download='expression_scene_ratings_v2.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></html>
