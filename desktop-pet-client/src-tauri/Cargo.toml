[package]
name = "maibot-desktop-pet"
version = "1.0.0"
description = "MaiBot desktop companion"
authors = ["MaiBot contributors"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9.8"
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
open = "5"
crc32fast = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
win32 = { package = "windows", version = "0.62", features = ["Win32_Graphics_Gdi"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
