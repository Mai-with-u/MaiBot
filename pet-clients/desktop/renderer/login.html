<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>连接桌宠 · MaiBot</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main>
    <h1>连接桌宠</h1>
    <form id="connection">
      <label for="server">服务器地址</label>
      <input id="server" type="url" placeholder="http://127.0.0.1:8001" required spellcheck="false" autocomplete="url">
      <details id="credentials" hidden>
        <summary>登录凭据 <span id="credential-status" role="status" hidden></span></summary>
        <label for="basic-user">Nginx 用户名（如有）</label>
        <input id="basic-user" maxlength="4096" autocomplete="off" spellcheck="false">
        <label for="basic-password">Nginx 密码</label>
        <input id="basic-password" type="password" maxlength="4096" autocomplete="off">
        <label for="webui-token">WebUI 密码</label>
        <input id="webui-token" type="password" maxlength="4096" autocomplete="off">
        <button id="forget-credentials" type="button">忘记此服务器的凭据</button>
      </details>
      <div id="bot-field" hidden>
        <label for="bot">机器人</label>
        <select id="bot" required disabled><option value="">请选择机器人</option></select>
      </div>
      <label class="check" title="仅本次连接有效；机器人设置也须允许读取桌面。"><input id="screen" type="checkbox"><span>允许读取本机屏幕</span></label>
      <p id="status" role="status" aria-live="polite" hidden></p>
      <button id="connect" type="submit">通过 WebUI 连接</button>
    </form>
  </main>
</body>
</html>
