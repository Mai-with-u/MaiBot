version: 2
updates:
  # Update the base image and uv image with pinned digests in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    ignore:
      # Keep Python on 3.13 while allowing patch and digest updates.
      - dependency-name: python
        versions: [">=3.14"]
    groups:
      docker-base-images:
        patterns:
          - "*"
