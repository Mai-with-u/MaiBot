name: Build Pet Clients (Manual)

on:
  workflow_dispatch:
    inputs:
      verify_android_only:
        description: 'Build and verify the Android APK without attaching it to a release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Lock the latest published release and its source commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pet_client_release.py resolve

  build:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    name: Build ${{ matrix.platform }} pet
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.verify_android_only && '["android"]' || '["windows", "android"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: automation
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: matrix.platform == 'windows'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/pet-clients/desktop/package-lock.json
      - name: Install Rust stable
        if: matrix.platform == 'windows'
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable
      - uses: actions/cache@v4
        if: matrix.platform == 'windows'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/pet-clients/desktop/src-tauri/target
          key: pet-windows-${{ runner.os }}-${{ hashFiles('source/pet-clients/desktop/src-tauri/Cargo.lock') }}
      - name: Build Windows installer
        if: matrix.platform == 'windows'
        working-directory: source/pet-clients/desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run dist:win

      - name: Restore Android release signing key
        if: matrix.platform == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.MAIBOT_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MAIBOT_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAIBOT_ANDROID_KEY_ALIAS }}
        run: |
          if (!$env:KEYSTORE_BASE64 -or !$env:STORE_PASSWORD -or !$env:KEY_ALIAS) {
            throw 'Configure MAIBOT_ANDROID_KEYSTORE_BASE64, MAIBOT_ANDROID_STORE_PASSWORD and MAIBOT_ANDROID_KEY_ALIAS repository secrets first.'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'maibot-android-release.jks'
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "MAIBOT_ANDROID_KEYSTORE=$keyPath" >> $env:GITHUB_ENV
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            source/pet-clients/android/**/*.gradle
            source/pet-clients/android/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
      - name: Install Android SDK packages
        if: matrix.platform == 'android'
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and check signed Android APK
        if: matrix.platform == 'android'
        working-directory: source/pet-clients/android
        env:
          MAIBOT_ANDROID_STORE_PASSWORD: ${{ secrets.MAIBOT_ANDROID_STORE_PASSWORD }}
          MAIBOT_ANDROID_KEY_ALIAS: ${{ secrets.MAIBOT_ANDROID_KEY_ALIAS }}
          MAIBOT_ANDROID_KEY_PASSWORD: ${{ secrets.MAIBOT_ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew.bat :app:assembleRelease :app:lintRelease --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ANDROID_HOME/build-tools/35.0.0/apksigner.bat" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect installer and checksum
        env:
          PET_PLATFORM: ${{ matrix.platform }}
        run: python automation/.github/scripts/pet_client_release.py collect --source source --output packages
      - uses: actions/upload-artifact@v4
        with:
          name: pet-client-${{ matrix.platform }}
          path: packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key
        if: always() && matrix.platform == 'android'
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'maibot-android-release.jks'
          if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }

  attach:
    name: Attach successful builds to the existing release
    needs: [resolve, build]
    if: ${{ always() && !inputs.verify_android_only && needs.resolve.outputs.ready == 'true' && !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: pet-assets-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: pet-client-*
          path: packages
          merge-multiple: true
      - name: Verify and attach packages without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python .github/scripts/pet_client_release.py attach --output packages
