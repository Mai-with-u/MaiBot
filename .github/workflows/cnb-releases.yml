name: Sync Releases to CNB

on:
  workflow_run:
    workflows: ['Build Pet Clients (Manual)', 'Publish MaiBot']
    types: [completed]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

# Share the lock with Git mirroring: refs must exist before releases are created.
concurrency:
  group: cnb-maibot-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Mai-with-u/MaiBot' && vars.CNB_GROUP != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release synchronization
        run: node --test .github/scripts/sync_cnb_releases.test.cjs
      - name: Synchronize source refs first
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_GROUP: ${{ vars.CNB_GROUP }}
          CNB_MAIBOT_REPO: ${{ vars.CNB_MAIBOT_REPO }}
        run: node .github/scripts/sync_cnb_mirror.cjs
      - name: Synchronize published releases and attachments
        env:
          GH_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_GROUP: ${{ vars.CNB_GROUP }}
          CNB_MAIBOT_REPO: ${{ vars.CNB_MAIBOT_REPO }}
        run: node .github/scripts/sync_cnb_releases.cjs
      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnb-release-sync-status
          path: cnb-sync-output/releases.json
          if-no-files-found: ignore
          retention-days: 14
