name: Ruff PR Check
on:
  pull_request:
    paths:
      - "*.py"
      - "**/*.py"
      - "pyproject.toml"
      - "ruff.toml"
      - ".ruff.toml"
      - "setup.cfg"
      - "tox.ini"
      - ".pre-commit-config.yaml"
      - ".github/scripts/check_ruff_format_regressions.py"
      - ".github/workflows/ruff-pr.yml"
jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ruff and Run Checks
        uses: astral-sh/ruff-action@v3
        with:
          args: "--version"
          version: "0.15.11"
      - name: Run Ruff Check (No Fix)
        run: ruff check --output-format=github
        shell: pwsh
      - name: Run Ruff Format Check
        # checkout 默认检出 PR 合并提交；第一父提交才是该次合并实际使用的目标基线。
        run: python .github/scripts/check_ruff_format_regressions.py --baseline-ref 'HEAD^1'
        shell: pwsh
