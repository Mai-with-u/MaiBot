name: Star History

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

concurrency:
  group: star-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Generate Star history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/generate_star_history.py \
            --repo "${{ github.repository }}" \
            --output depends-data/star-history.svg

      - name: Commit Star history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add depends-data/star-history.svg
          if git diff --cached --quiet; then
            echo "No Star history changes."
          else
            git commit -m "docs: 更新 Star 历史图"
            git push origin HEAD:${{ github.ref_name }}
          fi
